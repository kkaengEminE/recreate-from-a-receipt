<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHIVUM · 취향의 기록 보관소</title>
<link rel="stylesheet" href="archive.css"><body>
<header><div><small>ARCHIVUM / PERSONAL INDEX</small><h1>취향의 기록 보관소</h1></div><button id="settingsBtn">✦ 서고 설정</button></header>
<nav><button id="deskBtn" class="active">작품 입력</button><button id="libraryBtn">전체 기록</button></nav>
<main id="desk"><section><small>ARCHIVUM</small><h2>어떤 작품을 보셨나요?</h2><form id="lookup"><input id="query" required placeholder="미생, 내일의 죠, 주술회전…" aria-label="작품명"><button class="primary" id="judge">AI 평가</button></form><p id="status" role="status">작품명을 입력하고 Enter를 누르세요.</p></section></main>
<main id="library" hidden><h2>전체 기록</h2><div id="stats"></div><div id="bins" aria-label="점수 구간별 분포"></div><div class="filters"><input id="search" placeholder="작품·작가·라벨 검색"><select id="media"><option value="">모든 매체</option></select><select id="sort"><option>최근 기록순</option><option>점수순</option></select></div><div id="cards"></div></main>
<dialog id="record"><form id="edit"><small id="source"></small><h2 id="title"></h2><p id="reason"></p><div class="pair"><label>내 점수 / 50<input required type="number" min="0" max="50" step="1" id="score"></label><label>감상일<input type="date" id="date"></label></div><label>매체<input id="kind"></label><label>작가 · 감독<input id="author"></label><label>라벨<input id="labels"></label><label>감상 메모<textarea id="note"></textarea></label><footer><button type="button" data-close>닫기</button><button class="primary">기록 저장</button></footer></form></dialog>
<dialog id="settings"><form id="prefs"><small>PERSONAL INDEX</small><h2>서고 설정</h2><label>Gemini API 키 · 이 탭에서 사용<input id="key" type="password" autocomplete="off"></label><label>Gemini 모델<input id="model" required pattern="[A-Za-z0-9._-]+"></label><label>추가 취향 지시문 (선택)<textarea id="instruction"></textarea></label><p>평가 시 작품명과 취향 지시문을 Google에 전송합니다. 기준점은 내일의 죠 30점, 주술회전 13점입니다.</p><button type="button" id="backup">JSON 내보내기</button><label>JSON 가져오기<input id="restore" type="file" accept=".json"></label><footer><button type="button" data-close>닫기</button><button class="primary">설정 저장</button></footer></form></dialog>
<script src="archive.js"></script></body></html>
