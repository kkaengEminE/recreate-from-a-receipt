<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHIVUM · 취향의 기록 보관소</title><style>
:root{--ink:#2c2924;--muted:#817667;--line:#d9cdbb;--paper:#f8f1e5;--gold:#b47734;--rust:#a64d38;--green:#486653}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#e8dfd1;font-family:Georgia,'Noto Serif KR',serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#7c6247 .5px,transparent .6px);background-size:7px 7px}.app{max-width:1440px;margin:auto;min-height:100vh;padding:28px 38px 50px}.top{display:flex;justify-content:space-between;align-items:center;padding:0 4px 23px;border-bottom:1px solid #cabbab}.eyebrow,.side-title,.nav-title{font:700 10px ui-monospace,monospace;letter-spacing:.16em;color:var(--rust)}h1{margin:7px 0 0;font-size:27px;font-weight:600;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px;margin-top:7px}.profile{display:flex;gap:12px;align-items:center;cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#31483b;color:#f9eedc;font-size:20px;border:3px solid #ddc8a6}.profile span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.gear{font:20px sans-serif;color:var(--muted)}.layout{display:grid;grid-template-columns:215px 1fr 320px;gap:26px;margin-top:27px}.nav,.side{background:#f5eddfd9;border:1px solid var(--line);box-shadow:0 18px 50px #6a4b2714;border-radius:7px;padding:18px}.nav-title,.side-title{color:var(--muted);margin-bottom:14px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 10px;color:var(--ink);font:15px Georgia;cursor:pointer;border-radius:5px}.nav button:hover,.nav button.active{background:#e7d9c5;color:var(--rust)}.count{float:right;font:11px ui-monospace;color:var(--muted)}.nav hr,.rule{border:0;border-top:1px solid var(--line);margin:19px 0}.tag-cloud{display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid #cdbda8!important;border-radius:99px!important;padding:5px 8px!important;color:#6b5d4e!important;font-size:11px!important;background:#f9f2e8!important}.main{min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.toolbar h2{font-size:22px;font-weight:500;margin:0}.toolbar small{font:11px ui-monospace;color:var(--muted)}.controls{display:flex;gap:8px}.controls input,.controls select{border:1px solid var(--line);background:#f9f3e9;color:var(--ink);padding:9px 11px;border-radius:4px;font:12px Georgia}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:14px;min-height:190px;box-shadow:0 5px 18px #7e593315;cursor:pointer;position:relative;transition:.18s}.card:hover{transform:translateY(-3px)}.card.selected{border:2px solid var(--gold);padding:13px}.cover{height:92px;background:linear-gradient(135deg,#3a5146,#8f603c);border-radius:3px;margin-bottom:12px;display:grid;place-items:center;font-size:37px}.cover.orange{background:linear-gradient(135deg,#9d4939,#d29452)}.cover.blue{background:linear-gradient(135deg,#384f62,#8ca08d)}.card h3{font-size:16px;margin:0 0 4px}.meta{color:var(--muted);font-size:11px}.score{position:absolute;right:13px;top:112px;color:var(--rust);font-weight:bold;font-size:16px}.stars{color:#b47632;letter-spacing:1px;font-size:12px;margin-top:10px}.label{display:inline-block;margin-top:11px;color:var(--green);font-size:10px;border-bottom:1px dotted var(--green)}.add{border:1px dashed #c1ad93;background:#f6eddf;color:var(--rust);font:15px Georgia;min-height:190px;border-radius:5px;cursor:pointer}.add span{display:block;font-size:30px;margin-bottom:12px}.side{min-height:550px}.detail-empty{color:var(--muted);font-size:13px;line-height:1.7;margin-top:40px}.detail h2{font-size:22px;margin:2px 0 5px}.kind{color:var(--rust);font-size:12px}.quote{font-size:13px;line-height:1.7;background:#f0e5d4;padding:13px;border-left:3px solid var(--gold)}.score-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0}.big-score{font-size:39px;color:var(--rust)}.score-row button{border:1px solid #cdb18f;background:transparent;border-radius:4px;padding:7px 9px;color:var(--rust);cursor:pointer}.note{width:100%;height:76px;border:1px solid var(--line);background:#fbf6ee;padding:9px;resize:none;font:13px Georgia}.primary{border:0;background:var(--rust);color:#fff6e8;padding:11px 15px;border-radius:4px;font:13px Georgia;cursor:pointer}.ad{margin-top:22px;border-top:1px solid var(--line);padding-top:13px;color:#9b8a77;font:10px ui-monospace;text-align:center}.modal{position:fixed;inset:0;background:#33271966;display:none;place-items:center;z-index:3}.modal.show{display:grid}.modal-box{width:min(500px,calc(100% - 32px));background:var(--paper);border:1px solid var(--line);padding:25px;border-radius:7px}.modal-box h2{margin:0 0 19px;font-size:21px}.form-grid{display:grid;gap:11px}.form-grid label{font-size:11px;color:var(--muted)}.form-grid input,.form-grid select{width:100%;padding:11px;border:1px solid var(--line);background:#fffaf2;font:14px Georgia;border-radius:4px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.ghost{border:1px solid var(--line);background:transparent;padding:10px 14px;border-radius:4px;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:180px 1fr}.side{grid-column:2}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{padding:20px 14px}.layout{display:block}.nav{margin-bottom:18px}.side{margin-top:18px}.grid{grid-template-columns:1fr 1fr}.controls input{width:100px}.profile div:not(.avatar){display:none}}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">ARCHIVUM · PERSONAL INDEX</div><h1>취향의 기록 보관소</h1><div class="sub">읽고, 보고, 좋아하고, 다시 판단한 것들의 사서 기록</div></div><div class="profile" id="openSettings"><div class="avatar">✦</div><div><b>김의 취향 서고</b><span>개인 기록 · 24건</span></div><div class="gear">⚙</div></div></header><section class="layout"><nav class="nav"><div class="nav-title">INDEX</div><button class="active" data-filter="전체">⌂ 전체 기록 <span class="count" id="allCount">06</span></button><button data-filter="애니메이션">◈ 애니메이션 <span class="count">02</span></button><button data-filter="만화">▧ 만화 <span class="count">01</span></button><button data-filter="도서">▤ 도서 <span class="count">02</span></button><button data-filter="영화">▣ 영화 <span class="count">01</span></button><hr><div class="nav-title">MY LABELS</div><div class="tag-cloud"><button class="tag" data-label="몬스터"># 몬스터</button><button class="tag" data-label="성장담"># 성장담</button><button class="tag" data-label="여운"># 여운</button><button class="tag" data-label="고전"># 고전</button></div><hr><button id="openAdd" style="color:var(--rust)">＋ 새 기록 남기기</button></nav><section class="main"><div class="toolbar"><div><h2 id="viewTitle">전체 기록</h2><small>최근에 다시 펼쳐본 순서</small></div><div class="controls"><input id="search" placeholder="기록 검색…"><select id="sort"><option value="recent">최근 기록순</option><option value="score">내 점수순</option></select></div></div><div class="grid" id="grid"></div></section><aside class="side" id="detail"><div class="side-title">OPENED FOLIO · 선택한 기록</div><div class="detail-empty">왼쪽 기록 카드를 펼쳐보세요.<br>AI의 첫 판정과 당신의 최종 감상을<br>한 장의 문서에 함께 보관합니다.</div><div class="ad">SPONSOR'S MARK · 무료 서고의 운영을 돕습니다</div></aside></section></main><div class="modal" id="modal"><div class="modal-box"><h2>새 기록 남기기</h2><form id="form" class="form-grid"><label>작품명<input id="fTitle" required placeholder="예: 내일의 죠"></label><label>종류<select id="fType"><option>애니메이션</option><option>만화</option><option>도서</option><option>영화</option></select></label><label>작가 / 감독<input id="fAuthor" placeholder="예: 아사오 타카무리"></label><label>내가 붙인 라벨<input id="fLabel" placeholder="예: 성장담, 여운"></label><label>AI 첫 판정 (10점 만점)<input id="fAi" type="number" min="0" max="10" step="0.1" value="7.5"></label><div class="modal-actions"><button type="button" class="ghost" id="closeModal">닫기</button><button class="primary">기록 보관하기</button></div></form></div></div><script>
const initial=[{id:1,title:'주술회전',type:'애니메이션',author:'아쿠타미 게게',label:'액션 · 용두사미',score:6.8,ai:7.4,icon:'呪',color:'orange',note:'아이디어와 전투 연출은 뛰어났지만, 마지막 장의 감정적 회수가 아쉬웠다.'},{id:2,title:'내일의 죠',type:'애니메이션',author:'카지와라 잇키',label:'성장담 · 고전',score:9.4,ai:9.1,icon:'拳',color:'blue',note:'끝까지 쌓아온 인물의 선택이 결말에서 정확히 울린다. 완결의 힘.'},{id:3,title:'디지몬 어드벤처',type:'애니메이션',author:'토에이 애니메이션',label:'몬스터 · 여운',score:8.7,ai:8.2,icon:'◈',color:'',note:'모험의 설렘과 이별의 여운. 어린 시절의 기준점.'},{id:4,title:'도쿄 구울',type:'만화',author:'이시다 스이',label:'몬스터 · 어둠',score:7.1,ai:7.7,icon:'☽',color:'',note:'정체성에 대한 질문은 좋았지만 후반부 호흡이 급하다.'},{id:5,title:'사피엔스',type:'도서',author:'유발 하라리',label:'고전 · 인문',score:8.1,ai:8.0,icon:'⌘',color:'blue',note:'큰 그림을 보는 재미. 사실과 해석을 분리해 읽을 필요가 있다.'},{id:6,title:'파프리카',type:'영화',author:'곤 사토시',label:'여운 · 초현실',score:8.9,ai:8.6,icon:'✦',color:'orange',note:'꿈과 현실의 경계가 무너지는 시청각적 기록.'}];let records=JSON.parse(localStorage.getItem('archivum-records')||'null')||initial,filter='전체',selected=null;const $=s=>document.querySelector(s);function save(){localStorage.setItem('archivum-records',JSON.stringify(records))}function stars(n){return '★'.repeat(Math.round(n/2))+'☆'.repeat(5-Math.round(n/2))}function render(){let q=$('#search').value.toLowerCase(),list=records.filter(r=>(filter==='전체'||r.type===filter)&&(r.title+r.author+r.label).toLowerCase().includes(q));if($('#sort').value==='score')list.sort((a,b)=>b.score-a.score);$('#grid').innerHTML=list.map(r=>`<article class="card ${selected?.id===r.id?'selected':''}" data-id="${r.id}"><div class="cover ${r.color}">${r.icon}</div><h3>${r.title}</h3><div class="meta">${r.type} · ${r.author}</div><div class="score">${r.score.toFixed(1)}</div><div class="stars">${stars(r.score)}</div><div class="label"># ${r.label}</div></article>`).join('')+`<button class="add" id="addCard"><span>＋</span>새 기록을<br>서고에 놓기</button>`;document.querySelectorAll('.card').forEach(e=>e.onclick=()=>openDetail(records.find(r=>r.id==e.dataset.id)));$('#addCard').onclick=openAdd;$('#allCount').textContent=String(records.length).padStart(2,'0')}function openDetail(r){selected=r;render();$('#detail').innerHTML=`<div class="side-title">OPENED FOLIO · ${r.type}</div><div class="detail"><h2>${r.title}</h2><div class="kind">${r.author} · #${r.label}</div><hr class="rule"><div class="quote">“${r.note}”</div><div class="score-row"><div><small>나의 최종 점수</small><div class="big-score">${r.score.toFixed(1)}<span style="font-size:16px;color:var(--muted)"> / 10</span></div></div><button id="adjust">점수 보정</button></div><div class="meta">AI 첫 판정 ${r.ai.toFixed(1)} · 나의 보정 ${(r.score-r.ai>=0?'+':'')+(r.score-r.ai).toFixed(1)}</div><hr class="rule"><label class="meta">사서의 메모</label><textarea class="note" id="note">${r.note}</textarea><button class="primary" id="saveNote" style="margin-top:9px">메모 저장</button></div><div class="ad">SPONSOR'S MARK · 무료 서고의 운영을 돕습니다</div>`;$('#saveNote').onclick=()=>{r.note=$('#note').value;save();render();openDetail(r)};$('#adjust').onclick=()=>{let v=prompt('최종 점수 (0~10)',r.score);if(v!==null&&!isNaN(v)){r.score=Math.max(0,Math.min(10,Number(v)));save();render();openDetail(r)}}}function openAdd(){$('#modal').classList.add('show');$('#form').reset()}function close(){$('#modal').classList.remove('show')}document.querySelectorAll('.nav button[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#viewTitle').textContent=filter==='전체'?'전체 기록':filter;render()});document.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{$('#search').value=b.dataset.label;render()});$('#search').oninput=render;$('#sort').onchange=render;$('#openAdd').onclick=openAdd;$('#openSettings').onclick=()=>alert('설정 화면 준비 중입니다. 다음 단계에서 AI 모델·키·만점 기준·취향 지시문을 연결할 수 있어요.');$('#closeModal').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};$('#form').onsubmit=e=>{e.preventDefault();let r={id:Date.now(),title:$('#fTitle').value,type:$('#fType').value,author:$('#fAuthor').value||'미상',label:$('#fLabel').value||'새 라벨',ai:Number($('#fAi').value)||0,score:Number($('#fAi').value)||0,icon:'✦',color:'',note:'아직 첫 감상을 남기지 않았습니다.'};records.unshift(r);save();close();filter='전체';render();openDetail(r)};render();
</script><script>
/* Archivum v2: 50-point configurable rubric, AI settings, and portable backups. */
const oldRecords=JSON.parse(localStorage.getItem('archivum-records')||'null');
if(oldRecords&&oldRecords.length&&oldRecords[0].score<=10){oldRecords.forEach(r=>{r.score=Number((r.score*5).toFixed(1));r.ai=Number((r.ai*5).toFixed(1))});localStorage.setItem('archivum-records',JSON.stringify(oldRecords));records=oldRecords}
let archivumSettings=JSON.parse(localStorage.getItem('archivum-settings')||'null')||{model:'직접 입력 / 연결 예정',apiKey:'',base:25,max:50,weights:{completion:10,emotion:15,pacing:15,consensus:-15},instruction:'나는 결말의 완성도와 여운을 중요하게 봅니다. 급전개와 떡밥 미회수에는 민감합니다.'};
function saveSettings(){localStorage.setItem('archivum-settings',JSON.stringify(archivumSettings))}
function scoreStars(n){return '★'.repeat(Math.round(n/10))+'☆'.repeat(5-Math.round(n/10))}
function render(){let q=$('#search').value.toLowerCase(),list=records.filter(r=>(filter==='전체'||r.type===filter)&&(r.title+r.author+r.label).toLowerCase().includes(q));if($('#sort').value==='score')list.sort((a,b)=>b.score-a.score);$('#grid').innerHTML=list.map(r=>`<article class="card ${selected?.id===r.id?'selected':''}" data-id="${r.id}"><div class="cover ${r.color}">${r.icon}</div><h3>${r.title}</h3><div class="meta">${r.type} · ${r.author}</div><div class="score">${r.score.toFixed(1)}</div><div class="stars">${scoreStars(r.score)}</div><div class="label"># ${r.label}</div></article>`).join('')+`<button class="add" id="addCard"><span>＋</span>새 기록을<br>서고에 놓기</button>`;document.querySelectorAll('.card').forEach(e=>e.onclick=()=>openDetail(records.find(r=>r.id==e.dataset.id)));$('#addCard').onclick=openAdd;$('#allCount').textContent=String(records.length).padStart(2,'0')}
function openDetail(r){selected=r;render();$('#detail').innerHTML=`<div class="side-title">OPENED FOLIO · ${r.type}</div><div class="detail"><h2>${r.title}</h2><div class="kind">${r.author} · #${r.label}</div><hr class="rule"><div class="quote">“${r.note}”</div><div class="score-row"><div><small>나의 최종 점수</small><div class="big-score">${r.score.toFixed(1)}<span style="font-size:16px;color:var(--muted)"> / ${archivumSettings.max}</span></div></div><button id="adjust">점수 보정</button></div><div class="meta">AI 첫 판정 ${r.ai.toFixed(1)} · 나의 보정 ${(r.score-r.ai>=0?'+':'')+(r.score-r.ai).toFixed(1)}</div><hr class="rule"><label class="meta">사서의 메모</label><textarea class="note" id="note">${r.note}</textarea><button class="primary" id="saveNote" style="margin-top:9px">메모 저장</button></div><div class="ad">SPONSOR'S MARK · 무료 서고의 운영을 돕습니다</div>`;$('#saveNote').onclick=()=>{r.note=$('#note').value;save();render();openDetail(r)};$('#adjust').onclick=()=>{let v=prompt('최종 점수 (0~'+archivumSettings.max+')',r.score);if(v!==null&&!isNaN(v)){r.score=Math.max(0,Math.min(archivumSettings.max,Number(v)));save();render();openDetail(r)}}}
function openSettings(){const s=archivumSettings;let m=document.createElement('div');m.className='modal show';m.id='settingsModal';m.innerHTML=`<div class="modal-box" style="max-width:650px"><h2>사서의 설정</h2><div class="form-grid"><label>AI 모델 이름<input id="setModel" value="${s.model}"></label><label>AI API 키 <span style="color:var(--rust)">(이 브라우저에만 저장)</span><input id="setKey" type="password" value="${s.apiKey}" placeholder="sk-…"></label><label>취향 지시문<textarea id="setPrompt" class="note" style="height:85px">${s.instruction}</textarea></label><label>만점 기준<input id="setMax" type="number" min="10" max="100" value="${s.max}"></label><div class="meta">기본점 ${s.base} · 떡밥 회수 +${s.weights.completion} · 여운 +${s.weights.emotion} · 페이싱 ${s.weights.pacing} · 논란 ${s.weights.consensus}</div><div class="modal-actions"><button class="ghost" id="exportBtn">JSON 내보내기</button><button class="ghost" id="importBtn">JSON 가져오기</button><button class="ghost" id="settingsClose">닫기</button><button class="primary" id="settingsSave">설정 저장</button></div><input id="importFile" type="file" accept="application/json" style="display:none"></div></div>`;document.body.append(m);$('#settingsClose').onclick=()=>m.remove();$('#settingsSave').onclick=()=>{archivumSettings.model=$('#setModel').value;archivumSettings.apiKey=$('#setKey').value;archivumSettings.instruction=$('#setPrompt').value;archivumSettings.max=Number($('#setMax').value)||50;saveSettings();m.remove();render();if(selected)openDetail(selected)};$('#exportBtn').onclick=exportArchive;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=importArchive}
function exportArchive(){let payload={format:'archivum-json',version:2,exportedAt:new Date().toISOString(),settings:archivumSettings,records};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='archivum-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importArchive(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let p=JSON.parse(reader.result);if(!Array.isArray(p.records))throw Error();records=p.records;archivumSettings=p.settings||archivumSettings;save();saveSettings();filter='전체';render();alert('기록과 설정을 가져왔습니다.')}catch(_){alert('Archivum JSON 파일을 읽지 못했습니다.')}};reader.readAsText(f)}
document.querySelector('#openSettings').onclick=openSettings;document.querySelector('#form').onsubmit=e=>{e.preventDefault();let r={id:Date.now(),title:$('#fTitle').value,type:$('#fType').value,author:$('#fAuthor').value||'미상',label:$('#fLabel').value||'새 라벨',ai:Number($('#fAi').value)*5||0,score:Number($('#fAi').value)*5||0,icon:'✦',color:'',note:'아직 첫 감상을 남기지 않았습니다.'};records.unshift(r);save();close();filter='전체';render();openDetail(r)};render();
</script></body></html>
