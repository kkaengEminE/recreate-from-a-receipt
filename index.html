<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECREATE FROM A RECEIPT</title>
<style>
:root{--ink:#f6f0e4;--muted:#a7a092;--paper:#e9dfca;--orange:#ff6b3d;--blue:#8de3ff;--bg:#11110f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 8%,#303327 0,#171814 38%,#0e0e0d 100%);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh}button,input{font:inherit}.app{max-width:1500px;margin:auto;padding:24px 34px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #45443b;padding-bottom:18px}.brand{letter-spacing:.18em;font-size:13px}.sub{color:var(--muted);font-size:11px;margin-top:8px;letter-spacing:.04em}.status{font-size:11px;color:var(--blue);border:1px solid #4b8993;padding:8px 11px;border-radius:99px}.layout{display:grid;grid-template-columns:290px 1fr 330px;gap:26px;margin-top:25px}.panel{border:1px solid #3b3b35;background:rgba(24,24,20,.72);border-radius:14px;padding:18px}.panel h2{font-size:12px;letter-spacing:.13em;margin:0 0 17px;color:#d7ccb9}.receipt-form label{display:block;font-size:11px;color:var(--muted);margin:13px 0 6px}.receipt-form input{width:100%;background:#12130f;border:1px solid #4b4a41;color:var(--ink);padding:11px;border-radius:7px;outline:none}.receipt-form input:focus{border-color:var(--orange)}.primary{width:100%;border:0;background:var(--orange);color:#1e120e;padding:12px;border-radius:7px;font-weight:700;margin-top:18px;cursor:pointer}.hint{font-size:10px;line-height:1.6;color:#858278;margin-top:14px}.stage{position:relative;min-height:610px;overflow:hidden;background:linear-gradient(180deg,#1f211c,#151613);border-radius:18px;border:1px solid #46463c}.stage:before{content:"RECONSTRUCTION FIELD / 01";position:absolute;top:18px;left:20px;color:#64655b;font-size:10px;letter-spacing:.12em}.grid{position:absolute;inset:0;background-image:linear-gradient(#34362e 1px,transparent 1px),linear-gradient(90deg,#34362e 1px,transparent 1px);background-size:42px 42px;opacity:.28;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}.avatar{position:absolute;left:50%;top:50%;transform:translate(-50%,-45%);width:205px;height:430px;filter:drop-shadow(0 18px 20px #0008);transition:transform .15s}.head{width:66px;height:77px;border-radius:45% 45% 42% 42%;background:linear-gradient(135deg,#e5b17f,#9c6240);margin:auto;position:relative;z-index:2}.neck{width:27px;height:28px;background:#a96d49;margin:-3px auto 0}.torso{width:108px;height:145px;background:linear-gradient(90deg,#a76540,#e4aa76 48%,#8f5438);margin:auto;border-radius:47% 47% 20% 20%;position:relative}.arm{width:52px;height:150px;background:linear-gradient(#d18f61,#925738);position:absolute;top:10px;border-radius:35px}.arm.l{right:88px;transform:rotate(10deg)}.arm.r{left:88px;transform:rotate(-10deg)}.hip{width:96px;height:55px;background:#8f5238;margin:auto;border-radius:20px}.leg{position:absolute;top:295px;width:43px;height:133px;border-radius:20px;background:linear-gradient(90deg,#9e6243,#d49362,#805039)}.leg.l{left:51px}.leg.r{right:51px}.foot{position:absolute;top:415px;width:62px;height:20px;background:#754936;border-radius:50%}.foot.l{left:28px}.foot.r{right:28px}.rack{position:absolute;left:9%;bottom:28px;width:82%;height:80px;border:1px solid #55574c;border-radius:10px;background:#171812cc}.rack:after{content:"WARDROBE // receipts accumulate here";position:absolute;left:18px;bottom:12px;font-size:10px;color:#77786d}.slot{position:absolute;bottom:28px;width:52px;height:68px;background:var(--paper);color:#2f2b23;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);padding:10px 6px;font-size:8px;transform:rotate(var(--r));cursor:pointer;box-shadow:0 3px 7px #0008}.slot.selected{outline:2px solid var(--orange);outline-offset:3px}.slot:nth-child(1){left:18%}.slot:nth-child(2){left:29%;--r:-7deg}.slot:nth-child(3){left:40%;--r:5deg}.slot:nth-child(4){left:51%;--r:-3deg}.slot:nth-child(5){left:62%;--r:8deg}.slot .tiny{display:block;border-top:1px dashed #756d5a;margin-top:7px;padding-top:5px}.action{position:absolute;right:19px;top:19px;background:#21241e;color:var(--blue);border:1px solid #4b8993;border-radius:6px;padding:9px 11px;font-size:11px;cursor:pointer}.action:disabled{opacity:.35;cursor:not-allowed}.item-list{display:flex;flex-direction:column;gap:9px}.item{padding:12px;border:1px solid #414239;border-radius:8px;cursor:pointer;background:#181914}.item:hover,.item.active{border-color:var(--orange)}.item .name{font-size:12px}.item .meta{color:#85877a;font-size:10px;margin-top:6px}.empty{color:#77786e;font-size:11px;padding:20px 0;line-height:1.6}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;background:#f5e6c8;color:#2e2019;border-radius:8px;padding:19px 25px;box-shadow:0 0 0 8px #ff6b3d33,0 20px 80px #000;z-index:5}.toast.show{animation:receipt .9s ease-out}.flame{position:absolute;left:50%;top:38%;font-size:80px;opacity:0;pointer-events:none}.flame.show{animation:burn 1.05s ease-out}.cooldown{font-size:10px;color:#ffa17b;margin-top:12px;min-height:14px}@keyframes receipt{0%{opacity:0;transform:translate(-50%,-50%) scale(.7) rotate(-7deg)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(2deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) rotate(0)}}@keyframes burn{0%{opacity:0;transform:translate(-50%,20px) scale(.4)}35%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-100px) scale(.7)}}.active-object{position:absolute;z-index:3;left:50%;top:51%;font-size:52px;display:none;cursor:grab;user-select:none}.active-object.on{display:block;animation:drop .6s cubic-bezier(.2,1.5,.4,1)}.active-object.fading{filter:grayscale(1);opacity:.45;transition:filter 60s linear,opacity 60s linear}@keyframes drop{from{transform:translate(-50%,-250px) rotate(-15deg);opacity:0}to{transform:translate(-50%,0) rotate(0);opacity:1}}@media(max-width:1000px){.layout{grid-template-columns:1fr}.stage{min-height:560px}.app{padding:18px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">RECREATE FROM A RECEIPT</div><div class="sub">영수증을 태우면, 소비의 장면이 잠깐 현실이 된다.</div></div><div class="status">LOCAL ONLY · 저장 중</div></header><section class="layout"><aside class="panel"><h2>REGISTER / 영수증 등록</h2><form class="receipt-form" id="form"><label>무엇을 샀나요?</label><input id="title" required placeholder="예: 사과 3개"><label>가격 (₩)</label><input id="price" type="number" required placeholder="12000"><label>분류</label><input id="category" placeholder="물건 / 수영 / 목욕 / 마사지"><button class="primary">+ 옷장에 덧붙이기</button></form><div class="hint">데이터는 이 브라우저의 localStorage에만 저장됩니다. 서버 업로드 없음.</div></aside><section class="stage" id="stage"><div class="grid"></div><button class="action" id="recast" disabled>재계상 ↯</button><div class="flame" id="flame">🔥</div><div class="toast" id="toast"></div><div class="active-object" id="object"></div><div class="avatar" id="avatar"><div class="head"></div><div class="neck"></div><div class="torso"><div class="arm l"></div><div class="arm r"></div></div><div class="hip"></div><div class="leg l"></div><div class="leg r"></div><div class="foot l"></div><div class="foot r"></div></div><div class="rack" id="rack"></div></section><aside class="panel"><h2>RECEIPT STACK / 04</h2><div id="list" class="item-list"></div><div id="cooldown" class="cooldown"></div><div class="hint">항목을 고르고 재계상하세요. 생성된 물건/행동은 1분간 방향키로 움직일 수 있습니다. 시간이 끝나면 물건은 회색 비활성 상태가 되고, 행동은 사라집니다.</div></aside></section></main><script>
const seed=[{id:1,title:'사과 3개',price:4800,category:'물건',emoji:'🍎'},{id:2,title:'수영장 입장',price:12000,category:'수영',emoji:'🏊'},{id:3,title:'대중목욕탕',price:9000,category:'목욕',emoji:'🛁'},{id:4,title:'마사지',price:65000,category:'마사지',emoji:'💆'}];let receipts=JSON.parse(localStorage.getItem('receipt-recreate')||'null')||seed;let selected=null, active=null, timer=null;const $=s=>document.querySelector(s);function save(){localStorage.setItem('receipt-recreate',JSON.stringify(receipts))}function render(){const list=$('#list'),rack=$('#rack');list.innerHTML='';rack.innerHTML='';receipts.forEach((r,i)=>{const el=document.createElement('div');el.className='item '+(selected?.id===r.id?'active':'');el.innerHTML=`<div class="name">${r.emoji||'🧾'} ${r.title}</div><div class="meta">₩${Number(r.price).toLocaleString()} · ${r.category||'기타'}</div>`;el.onclick=()=>{selected=r;$('#recast').disabled=false;render()};list.append(el);const slot=document.createElement('div');slot.className='slot '+(selected?.id===r.id?'selected':'');slot.style.setProperty('--r',`${[-5,4,-3,7][i%4]}deg`);slot.innerHTML=`${r.emoji||'🧾'}<span class="tiny">${r.title}</span>`;slot.onclick=()=>{selected=r;$('#recast').disabled=false;render()};rack.append(slot)});$('.panel h2').textContent=`RECEIPT STACK / ${String(receipts.length).padStart(2,'0')}`}function emojiFor(r){if(r.emoji)return r.emoji;const s=r.title+r.category;return /수영|풀/.test(s)?'🏊':/목욕|탕|사우나/.test(s)?'🛁':/마사지/.test(s)?'💆':/사과/.test(s)?'🍎':/귤|오렌지|과일/.test(s)?'🍊':/고양이/.test(s)?'🐈':'✨'}function recast(){if(!selected)return;clearInterval(timer);active=selected;const object=$('#object');object.textContent=emojiFor(active);object.className='active-object on';object.style.left='50%';object.style.top='51%';$('#toast').textContent=`${active.title} · ₩${Number(active.price).toLocaleString()}\n장면을 재계상했습니다`;$('#toast').className='toast show';$('#flame').className='flame show';$('#cooldown').textContent='ACTIVE 01:00 · 방향키로 이동 가능';let left=60;timer=setInterval(()=>{left--;$('#cooldown').textContent=`ACTIVE 00:${String(left).padStart(2,'0')} · 방향키로 이동 가능`;if(left<=0){clearInterval(timer);if(/수영|목욕|마사지/.test(active.category+active.title)){object.className='active-object';object.textContent=''}else{object.classList.add('fading');$('#cooldown').textContent='INACTIVE · 마우스로 치울 수 있음'}}},1000)}$('#form').onsubmit=e=>{e.preventDefault();const title=$('#title').value.trim();const price=$('#price').value;const category=$('#category').value.trim()||'물건';receipts.unshift({id:Date.now(),title,price,category,emoji:emojiFor({title,category})});save();e.target.reset();render()};$('#recast').onclick=recast;window.onkeydown=e=>{if(!active||!$('#object').classList.contains('on')||e.key.startsWith('Arrow')){if(!active||!$('#object').classList.contains('on'))return;const o=$('#object');const x=parseFloat(o.style.left||50),y=parseFloat(o.style.top||51);o.style.left=`${x+(e.key==='ArrowRight'?2:e.key==='ArrowLeft'?-2:0)}%`;o.style.top=`${y+(e.key==='ArrowDown'?2:e.key==='ArrowUp'?-2:0)}%`}};render();
</script></body></html>
