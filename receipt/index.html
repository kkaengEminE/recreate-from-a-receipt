<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영수증 재계상실</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172622;color:#f4ecdc;font:15px system-ui}main{max-width:1280px;margin:auto;padding:3vw}header{border-bottom:1px solid #66766a;padding-bottom:18px}h1{font:500 clamp(32px,5vw,68px) Georgia,serif;margin:4px 0}section{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:20px;margin-top:20px}canvas{width:100%;height:67vh;display:block;touch-action:none;border-radius:12px}aside{background:#eee6d6;color:#282f29;padding:20px;border-radius:10px}label,select,input,button{display:block;width:100%;margin:8px 0;font:inherit}input,select,button{padding:10px;border:1px solid #b7b5a7;border-radius:5px}button{background:#28483c;color:white;cursor:pointer}#burn{background:#b44927}p,small{line-height:1.6}output{color:#ffd39b}@media(max-width:720px){section{grid-template-columns:1fr}canvas{height:52vh}}
</style><main><header><small>RECREATE FROM A RECEIPT</small><h1>영수증 재계상실</h1></header><section><div><canvas id="field"></canvas><p>왼쪽 인형을 드래그해 돌리고 영수증을 누르세요. 오른쪽에서 구현된 대상을 선택하면 방향키로 움직일 수 있습니다.</p><output id="status" aria-live="polite"></output></div><aside><h2>영수증 등록</h2><form id="form"><label>내용<input id="description" required maxlength="160" placeholder="사과 3개, 오렌지 2개"></label><label>가격 (원)<input id="price" type="number" required min="0"></label><button>인형에 붙이기</button></form><hr><label>영수증 선택<select id="stack"></select></label><button id="burn">재계상</button><small>입력한 영수증은 이 브라우저에만 저장됩니다.</small></aside></section></main><script type="module" src="./studio.js"></script></html>
