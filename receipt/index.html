<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영수증 재계상실</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172622;color:#f4ecdc;font:15px system-ui}main{max-width:1280px;margin:auto;padding:3vw}header{border-bottom:1px solid #66766a;padding-bottom:18px}h1{font:500 clamp(32px,5vw,68px) Georgia,serif;margin:4px 0}section{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:20px;margin-top:20px}canvas{width:100%;height:67vh;display:block;touch-action:none;border-radius:12px}aside{background:#eee6d6;color:#282f29;padding:20px;border-radius:10px}label,select,input,button{display:block;width:100%;margin:8px 0;font:inherit}input,select,button{padding:10px;border:1px solid #b7b5a7;border-radius:5px}button{background:#28483c;color:white;cursor:pointer}#burn{background:#b44927}p,small{line-height:1.6}output{color:#ffd39b}@media(max-width:720px){section{grid-template-columns:1fr}canvas{height:52vh}}
nav{display:flex;gap:8px;margin-top:14px}nav button{width:auto}nav [aria-pressed=true]{background:#f1debb;color:#26372b}.stage{position:relative;overflow:hidden;border-radius:12px}#fire{position:absolute;left:50%;top:44%;width:140px;height:174px;transform:translate(-50%,-50%);pointer-events:none}#slip{box-sizing:border-box;background:repeating-linear-gradient(#fff3cf 0 15px,#dfcfb1 16px);color:#47321d;height:100%;padding:30px 12px;font:bold 18px monospace;animation:char 1.7s ease-in forwards}.flames{position:absolute;bottom:0;width:100%;height:62px;animation:rise 1.7s ease-in forwards}.flames i{position:absolute;bottom:0;width:32%;height:100%;border-radius:90% 5% 60% 35%;background:radial-gradient(ellipse at 45% 80%,#ffffae 7%,#ffae22 42%,#ec4119 68%,transparent 74%);filter:drop-shadow(0 0 8px #f85c15);transform-origin:bottom;animation:lick .17s ease-in-out infinite alternate}@keyframes lick{to{transform:skewX(-12deg) scaleY(.62)}}@keyframes rise{0%{opacity:0}12%{opacity:1}85%{opacity:1}100%{bottom:100%;opacity:0}}@keyframes char{0%{clip-path:inset(0);filter:none}100%{clip-path:inset(0 0 100%);filter:sepia(1) brightness(.34)}}
</style><main><header><small>RECREATE FROM A RECEIPT</small><h1>영수증 재계상실</h1></header><nav><button id="registerTab">영수증 붙이기</button><button id="useTab">재계상 보기</button></nav><section><div><div class="stage"><canvas id="field"></canvas><div id="fire" hidden><div id="slip"></div><div class="flames"></div></div></div><p id="hint"></p><output id="status" aria-live="polite"></output></div><aside><h2 id="heading"></h2><form id="form"><label>내용<input id="description" required maxlength="160" placeholder="사과 3개, 오렌지 2개"></label><label>가격 (원)<input id="price" type="number" required min="0"></label><button>인형에 붙이기</button></form><div id="usePanel"><label>영수증 선택<select id="stack"></select></label><button id="burn">재계상</button></div><small>입력한 영수증은 이 브라우저에만 저장됩니다.</small></aside></section></main><script type="module" src="./studio.js"></script></html>
